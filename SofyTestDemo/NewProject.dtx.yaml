note: Generated from recorded traffic using edge 145.0.3800.82
configuration:
  dataset: Valuess.csv
  profile: edge
  vars:
    APP_SofyConsole_URL:
      expr: gTestHubUrl
      type: column
      modifier: in
    Username:
      expr: demo.user
      type: val
      modifier: in
    Password:
      expr: gTestHubPassword
      type: column
      modifier: in
    Name:
      expr: TestProject
      type: val
      modifier: in
    Git_URL:
      expr: https://github.com/HCL-TECH-SOFTWARE/Emerald-One-Test-Studio-Tests.git
      type: val
      modifier: in
    Username_2:
      expr: githubUser
      type: column
      modifier: in
steps:
  - open:
      enabled: 'false'
      note: Open SofyConsole
      url: '${APP_SofyConsole_URL}'
  - with:
      enabled: 'false'
      note: Sign in to platform
      steps:
        - click:
            shot: ../SofyConsole/Sign in to platform_uhdis6.dti.jpeg#48
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
        - type:
            shot: ../SofyConsole/Sign in to platform_lsejvq.dti.jpeg#86
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
            value: '${Username}'
        - click:
            shot: ../SofyConsole/Sign in to platform_bgwn7o.dti.jpeg#165
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
        - type:
            shot: ../SofyConsole/Sign in to platform_z2caul.dti.jpeg#203
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
            value: '${Password}'
        - click:
            shot: ../SofyConsole/Sign in to platform_hxbzef.dti.jpeg#286
            object: html.button
            identifiers:
              - properties:
                  - content: Sign In
  - with:
      note: DevOps Test Hub - Initial - Team Space Dashboard
      steps:
        - click:
            shot: ../SofyConsole/DevOps Test Hub - Initial - Team Space Dashboard_2ujnwx.dti.jpeg#144
            object: html.span
            identifiers:
              - properties:
                  - content: New Project
                locators:
                  - inside:
                      object: html.button
                      properties:
                        - content: New Project
        - click:
            shot: ../SofyConsole/DevOps Test Hub - Initial - Team Space Dashboard_4e5hhc.dti.jpeg#307
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Name
        - type:
            shot: ../SofyConsole/DevOps Test Hub - Initial - Team Space Dashboard_r655bd.dti.jpeg#466
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Name
            value: '${Name}'
        - press:
            enabled: 'false'
            shot: ../SofyConsole/DevOps Test Hub - Initial - Team Space Dashboard_7rexc7.dti.jpeg#784
            key: enter
        - click:
            shot: ../SofyConsole/DevOps Test Hub - Initial - Team Space Dashboard_7rexc7.dti.jpeg#784
            object: html.span
            identifiers:
              - properties:
                  - content: Create
  - with:
      note: DevOps Test Hub
      steps:
        - click:
            shot: ../SofyConsole/DevOps Test Hub_ej44sv.dti.jpeg#958
            object: html.span
            identifiers:
              - properties:
                  - content: Add Repository
        - click:
            shot: ../SofyConsole/DevOps Test Hub_6bpoos.dti.jpeg#1253
            object: html.span
            identifiers:
              - properties:
                  - content: Remote Repository
        - click:
            shot: ../SofyConsole/DevOps Test Hub_6bpoos.dti-1784645991159.dti.jpeg
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Git URL
        - type:
            shot: ../DevOps Test Hub_c5w6o2.dti.jpeg#1519
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Git URL
            value: '${Git_URL}'
        - click:
            shot: ../SofyConsole/DevOps Test Hub_lnkhgw.dti.jpeg#2054
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
        - type:
            shot: ../SofyConsole/DevOps Test Hub_jlf6jv.dti.jpeg#2318
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
            value: '${Username_2}'
        - click:
            shot: ../SofyConsole/DevOps Test Hub_cpna3x.dti.jpeg#2864
            object: html.button
            identifiers:
              - properties:
                  - content: Add
        - wait: 7000ms
