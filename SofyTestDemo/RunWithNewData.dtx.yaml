note: Generated from recorded traffic using edge 145.0.3800.97
configuration:
  dataset: Valuess.csv
  profile: edge
  vars:
    pp:
      expr: gTestHubPassword
      type: column
    APP_SofyTestDemo_URL:
      expr: gTestHubUrl
      type: column
    Username: demo.user
    Branch_Name: xEditBranch
    Name: Users3
    Number_of_Rows: '3'
    Done: ''
