            identifiers:
              - properties:
                  - label: Username
        - type:
            shot: Sign in to platform_jfpmvr.dti.jpeg#86
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
            value: '${Username}'
        - click:
            shot: Sign in to platform_f7ghur.dti.jpeg#165
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
        - type:
            shot: Sign in to platform_uwymco.dti.jpeg#203
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
            value: '${pp}'
        - click:
            shot: Sign in to platform_3y5xmi.dti.jpeg#286
