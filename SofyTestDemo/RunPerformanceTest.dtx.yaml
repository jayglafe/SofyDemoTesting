note: Generated from recorded traffic using edge 145.0.3800.97
configuration:
  dataset: Valuess.csv
  profile: edge
  vars:
    APP_SofyTestDemo_URL:
      expr: gTestHubUrl
      type: column
    Username: demo.user
    Password:
      expr: gTestHubPassword
      type: column
    Name: Cpu for HCL-Commerce
    TYPE_2: |+
      sum(system_cpu_usage{app="HCL-Commerce"}) by (pod)

    Name_3: Memory for comdemo pods
    TYPE_4: sum (jvm_memory_used_bytes{kubernetes_pod_name=~"comdemo.*"}) by (pod)
    a_few_seconds_ago: EmeraldMetrics
    Done: NotInitialized
    PrometheusIp: 34.118.224.19
    PrometheusPort: '80'
steps:
  - open:
      enabled: 'false'
      note: Open SofyTestDemo
      url: '${APP_SofyTestDemo_URL}'
  - with:
      enabled: 'false'
      note: Sign in to platform
      steps:
        - click:
            shot: Sign in to platform_fx2skb.dti.jpeg#48
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
        - type:
            shot: Sign in to platform_x2wwpw.dti.jpeg#86
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
            value: '${Username}'
        - click:
            shot: Sign in to platform_672zv6.dti.jpeg#165
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
        - type:
            shot: Sign in to platform_r47dfo.dti.jpeg#203
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
            value: '${Password}'
        - click:
            shot: Sign in to platform_ewrqtd.dti.jpeg#286
            object: html.button
            identifiers:
              - properties:
                  - content: Sign In
        - wait: 10000ms
  - with:
      note: DevOps Test Hub - Initial - Team Space Dashboard
      steps:
        - click:
            shot: DevOps Test Hub - Initial - Team Space Dashboard_xvjxk2.dti.jpeg#173
            object: html.img
            identifiers:
              - properties:
                  - src: content/images/banner-brand-icon-3.svg
        - wait: 1000ms
        - click:
            shot: DevOps Test Hub - Initial - Team Space Dashboard_xvjxk2.dti.jpeg#173
            object: html.div
            identifiers:
              - properties:
                  - content: |-
                      Owners
                      DU
  - with:
      note: DevOps Test Hub - 1200 - Overview
      steps:
        - wait: 1000ms
        - click:
            enabled: 'false'
            shot: DevOps Test Hub - 1200 - Overview_5l7hf5.dti.jpeg#831
            object: html.div
            identifiers:
              - properties:
                  - content: Demo
        - click:
            enabled: 'false'
            shot: DevOps Test Hub - 1200 - Overview_5l7hf5.dti.jpeg#831
            object: html.p
            identifiers:
              - properties:
                  - content: DEV
        - click:
            shot: DevOps Test Hub - 1200 - Overview_5l7hf5-1773154279699.dti.jpeg
            object: html.div
            identifiers:
              - properties:
                  - content: Infrastructure
                locators:
                  - below:
                      object: html.div
                      properties:
                        - content: TestProject
  - with:
      note: DevOps Test Hub - TestProject - Agents and Intercepts
      steps:
        - click:
            shot: DevOps Test Hub - TestProject - Agents and Inter_37itth.dti.jpeg#1118
            object: html.div
            identifiers:
              - properties:
                  - content: Resource Monitoring
  - with:
      note: DevOps Test Hub - TestProject - Resource Monitoring
      steps:
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_mgoy32.dti.jpeg#1338
            object: html.span
            identifiers:
              - properties:
                  - content: Add Source
                locators:
                  - inside:
                      object: html.button
                      properties:
                        - content: Add Source
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_guh2wo.dti.jpeg#1514
            object: html.span
            identifiers:
              - properties:
                  - content: Add a Prometheus server…
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_kdtonm.dti.jpeg#1704
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Target host
        - type:
            shot: DevOps Test Hub - TestProject - Resource Monitor_3xehxf.dti.jpeg#1908
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Target host
            value: '${PrometheusIp}'
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_dqdama.dti.jpeg#2318
            object: html.inputtextfield
            identifiers:
              - properties:
                  - label: Port number
        - type:
            shot: DevOps Test Hub - TestProject - Resource Monitor_t3ycdm.dti.jpeg#2548
            object: html.inputtextfield
            identifiers:
              - properties:
                  - label: Port number
            value: '${PrometheusPort}'
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_t3ycdm.dti.jpeg#2548
            object: html.span
            identifiers:
              - properties:
                  - content: Add
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_aoivo2.dti.jpeg#2751
            object: html.span
            identifiers:
              - properties:
                  - content: Add a query
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_toimam.dti.jpeg#3164
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Name
        - type:
            shot: DevOps Test Hub - TestProject - Resource Monitor_alhwtr.dti.jpeg#3514
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Name
            value: '${Name}'
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_jocsbj.dti.jpeg#4569
            object: html.textarea
            identifiers:
              - properties:
                  - label: Type and test your PromQL query
        - type:
            shot: DevOps Test Hub - TestProject - Resource Monitor_jocsbj.dti.jpeg#4569
            object: html.textarea
            identifiers:
              - properties:
                  - label: Type and test your PromQL query
                locators:
                  - above:
                      object: html.button
                      properties:
                        - content: Test query
            value: '${TYPE_2}'
        - wait: 1000ms
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_phf7ve.dti.jpeg#5291
            object: html.span
            identifiers:
              - properties:
                  - content: Test query
        - wait: 1000ms
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_b7vdfa.dti.jpeg#5653
            object: html.span
            identifiers:
              - properties:
                  - content: Create
        - wait: 2000ms
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_62mt4y.dti.jpeg#5856
            object: html.span
            identifiers:
              - properties:
                  - content: Add a query
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_n45gaf.dti.jpeg#6321
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Name
        - type:
            shot: DevOps Test Hub - TestProject - Resource Monitor_6kadz7.dti.jpeg#6697
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Name
            value: '${Name_3}'
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_h6wvcr.dti.jpeg#7465
            object: html.label
            identifiers:
              - properties:
                  - content: Type and test your PromQL query
        - wait: 2000ms
        - type:
            shot: DevOps Test Hub - TestProject - Resource Monitor_jocsbj.dti.jpeg#4569
            object: html.textarea
            identifiers:
              - properties:
                  - label: Type and test your PromQL query
                locators:
                  - above:
                      object: html.button
                      properties:
                        - content: Test query
            value: '${TYPE_4}'
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_psjhcw.dti.jpeg#8604
            object: html.span
            identifiers:
              - properties:
                  - content: Test query
        - wait: 1000ms
        - wait: 1000ms
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_q3tlpq.dti.jpeg#8992
            object: html.span
            identifiers:
              - properties:
                  - content: Create
        - wait: 2000ms
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_fu5s6d.dti.jpeg#9345
            object: html.button
            identifiers:
              - properties:
                  - content: Save
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_kgddou.dti.jpeg#9472
            object: html.a
            identifiers:
              - properties:
                  - aria-label: Available sources,, 1,,
  - with:
      note: DevOps Test Hub - TestProject - Resource Monitoring
      steps:
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_qzjaxk.dti.jpeg#9739
            object: html.div
            identifiers:
              - properties:
                  - xpath: //div[@id='main']/div/div/div[2]/div/div/table/tbody/tr/td[7]/div/div
                locators:
                  - inside:
                      object: html.td
                      properties:
                        - position: '7 : 1'
        - type:
            shot: DevOps Test Hub - TestProject - Resource Monitor_sf35zj.dti.jpeg#9978
            object: html.inputtext
            identifiers:
              - properties:
                  - type: text
                locators:
                  - inside:
                      object: html.td
                      properties:
                        - position: '7 : 1'
                      locators:
                        - below:
                            object: html.body
                            properties:
                              - title: DevOps Test Hub - TestProject - Resource Monitoring
            value: '${a_few_seconds_ago}'
        - press:
            shot: DevOps Test Hub - TestProject - Resource Monitor_l7ku6j.dti.jpeg#10444
            key: enter
        - click:
            shot: DevOps Test Hub - TestProject - Resource Monitor_jwh4ps.dti.jpeg#10569
            object: html.div
            identifiers:
              - properties:
                  - content: Execute
                locators:
                  - position: '3'
  - with:
      note: DevOps Test Hub - TestProject - Execution
      steps:
        - click:
            shot: DevOps Test Hub - TestProject - Execution_a2h3cg.dti.jpeg#10983
            object: html.button
            identifiers:
              - properties:
                  - aria-label: 'Open execution dialog for: BenchmarkB2CFlow'
                locators:
                  - inside:
                      object: html.td
                      properties:
                        - position: '7 : 3'
        - click:
            shot: DevOps Test Hub - TestProject - Execution_nh5vq2.dti.jpeg#11619
            object: html.span
            identifiers:
              - properties:
                  - content: RESOURCE MONITORING
        - click:
            shot: DevOps Test Hub - TestProject - Execution_txeev6.dti.jpeg#12159
            object: html.i
            identifiers:
              - properties:
                  - aria-label: Select existing labels
        - click:
            shot: DevOps Test Hub - TestProject - Execution_txeev6.dti.jpeg#12159
            object: html.li
            identifiers:
              - properties:
                  - content: EmeraldMetrics
        - click:
            shot: DevOps Test Hub - TestProject - Execution_sriteq.dti.jpeg#13246
            object: html.span
            identifiers:
              - properties:
                  - content: Execute
        - do:
            steps:
              - wait: 5000ms
              - assign:
                  shot: DevOps Test Hub - TestProject - Execution_j3pgxf.dti.jpeg#13544
                  object: html.td
                  identifiers:
                    - properties:
                        - position: '5 : 3'
                  properties:
                    - content:
                        - var: Done
            while: Done != 'Pass' && Done != 'Fail' && Done != 'Error'
        - verify: Done == 'Pass'
        - click:
            shot: DevOps Test Hub - TestProject - Execution_j3pgxf.dti.jpeg#13544
            object: html.a
            identifiers:
              - properties:
                  - content: Pass
  - with:
      note: DevOps Test Hub - TestProject - Results
      steps:
        - click:
            shot: DevOps Test Hub - TestProject - Results_vgq7zd.dti.jpeg#13693
            object: html.img
            identifiers:
              - properties:
                  - src: content/images/banner-brand-icon-3.svg
