note: Generated from recorded traffic using edge 145.0.3800.70
configuration:
  dataset: Valuess.csv
  profile: edge
  vars:
    APP_SofyTestDemo_URL:
      expr: gTestHubUrl
      type: column
      modifier: in
    Username:
      expr: demo.user
      type: val
      modifier: in
    Password:
      expr: gTestHubPassword
      type: column
      modifier: in
    LiContract:
      expr: 'false'
      type: val
      modifier: in
steps:
  - open:
      note: Open SofyTestDemo
      url: '${APP_SofyTestDemo_URL}'
  - with:
      note: Sign in to platform
      steps:
        - click:
            shot: Sign in to platform_ri54h5.dti.jpeg#48
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
        - type:
            shot: Sign in to platform_kkkiwe.dti.jpeg#86
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
            value: '${Username}'
        - click:
            shot: Sign in to platform_ikn3xu.dti.jpeg#165
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
        - type:
            shot: Sign in to platform_yk6brw.dti.jpeg#203
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
            value: '${Password}'
        - wait: 1000ms
        - click:
            shot: Sign in to platform_d7bobt.dti.jpeg#286
            object: html.button
            identifiers:
              - properties:
                  - content: Sign In
  - with:
      note: DevOps Test Hub - Initial - Team Space Dashboard
      steps:
        - wait: 10000ms
        - assign:
            shot: DevOps Test Hub - Initial - Team Space Dashboard_jmiav4.dti.jpeg#354
            object: html.body
            identifiers:
              - properties:
                  - title: DevOps Test Hub - Initial - Team Space Dashboard
            properties:
              - content:
                  - var: LiContract
        - if:
            condition: LiContract.includes('Third Party License Agreements')
            steps:
              - click:
                  shot: DevOps Test Hub - Initial - Team Space Dashboard_g4ljl2.dti.jpeg#169
                  object: html.inputcheckbox
                  identifiers:
                    - properties:
                        - label: Google ChromeGoogle Terms of ServiceChrome and ChromeOS
                            Additional Terms of Service
              - click:
                  shot: DevOps Test Hub - Initial - Team Space Dashboard_jmiav4.dti.jpeg#354
                  object: html.inputcheckbox
                  identifiers:
                    - properties:
                        - label: Microsoft EdgeMicrosoft Software License Terms
              - click:
                  shot: DevOps Test Hub - Initial - Team Space Dashboard_k6y4aa.dti.jpeg#545
                  object: html.span
                  identifiers:
                    - properties:
                        - content: Save
