note: Generated from recorded traffic using edge 145.0.3800.82
configuration:
  dataset: Valuess.csv
  profile: edge
  vars:
    APP_SofyTestDemo_URL:
      expr: gTestHubUrl
      type: column
    Username: demo.user
    Password:
      expr: gTestHubPassword
      type: column
    Done: Unitialized
steps:
  - open:
      enabled: 'false'
      note: Open SofyTestDemo
      url: '${APP_SofyTestDemo_URL}'
  - with:
      enabled: 'false'
      note: Sign in to platform
      steps:
        - click:
            shot: Sign in to platform_3vtgr5.dti.jpeg#48
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
        - type:
            shot: Sign in to platform_rv5qjk.dti.jpeg#86
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
            value: '${Username}'
        - click:
            shot: Sign in to platform_lu3uvx.dti.jpeg#165
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
        - type:
            shot: Sign in to platform_cl4nuy.dti.jpeg#203
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
            value: '${Password}'
        - click:
            shot: Sign in to platform_k35d4v.dti.jpeg#286
            object: html.button
            identifiers:
              - properties:
                  - content: Sign In
        - wait: 3000ms
  - with:
      note: DevOps Test Hub - Initial - Team Space Dashboard
      steps:
        - click:
            shot: DevOps Test Hub - Initial - Team Space Dashboard_ul7cb7.dti.jpeg#160
            object: html.div
            identifiers:
              - properties:
                  - content: TestProject
                locators:
                  - above:
                      object: html.div
                      properties:
                        - content: No description.
  - run:
      enabled: 'false'
      url: SetDevBranch.dtx.yaml
  - with:
      note: DevOps Test Hub - 1800 - Overview
      steps:
        - click:
            shot: DevOps Test Hub - 1800 - Overview_lpamog.dti.jpeg#845
            object: html.div
            identifiers:
              - properties:
                  - content: Execute
  - with:
      note: DevOps Test Hub - TestProject - Execution
      steps:
        - click:
            shot: DevOps Test Hub - TestProject - Execution_7lt47x.dti.jpeg#1334
            object: html.button
            identifiers:
              - properties:
                  - aria-label: 'Open execution dialog for: Emerald_Homepage.jmx'
                locators:
                  - inside:
                      object: html.td
                      properties:
                        - position: '7 : 4'
        - click:
            shot: DevOps Test Hub - TestProject - Execution_jfgmfh.dti.jpeg#1968
            object: html.button
            identifiers:
              - properties:
                  - content: Execute
        - do:
            steps:
              - wait: 3000ms
              - assign:
                  shot: DevOps Test Hub - TestProject - Execution_xk24li.dti.jpeg#2075
                  object: html.td
                  identifiers:
                    - properties:
                        - position: '5 : 4'
                  properties:
                    - content:
                        - var: Done
            while: Done != 'Pass'
        - verify: Done == 'Pass'
        - click:
            shot: DevOps Test Hub - TestProject - Execution_xk24li.dti.jpeg#2075
            object: html.div
            identifiers:
              - properties:
                  - content: Analyze
                locators:
                  - leftof:
                      object: html.td
                      properties:
                        - position: '1 : 7'
  - with:
      note: DevOps Test Hub - TestProject - Results
      steps:
        - click:
            shot: DevOps Test Hub - TestProject - Results_gnbk37.dti.jpeg#2401
            object: html.img
            identifiers:
              - properties:
                  - src: content/images/banner-brand-icon-3.svg
