note: Generated from recorded traffic using edge 145.0.3800.82
configuration:
  dataset: Valuess.csv
  profile: edge
  vars:
    APP_SofyTestDemo_URL:
      expr: gTestHubUrl
      type: column
    Username: demo.user
    Password:
      expr: gTestHubPassword
      type: column
    Git_URL: https://github.com/HCL-TECH-SOFTWARE/Emerald-Other-Tests
    Username_2:
      expr: githubUser
      type: column
    Program_Arguments: --insecure
    Done: Uninitialized
steps:
  - open:
      enabled: 'false'
      note: Open SofyTestDemo
      url: '${APP_SofyTestDemo_URL}'
  - with:
      enabled: 'false'
      note: Sign in to platform
      steps:
        - click:
            shot: Sign in to platform_eank7k.dti.jpeg#48
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
        - type:
            shot: Sign in to platform_pijm4m.dti.jpeg#86
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
            value: '${Username}'
        - click:
            shot: Sign in to platform_lcm3qw.dti.jpeg#165
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
        - click:
            shot: Sign in to platform_rslgok.dti.jpeg#203
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
        - type:
            shot: Sign in to platform_hapnyt.dti.jpeg#241
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
            value: '${Password}'
        - click:
            shot: Sign in to platform_3uisdb.dti.jpeg#324
            object: html.button
            identifiers:
              - properties:
                  - content: Sign In
        - wait: 3000ms
  - with:
      note: DevOps Test Hub - Initial - Team Space Dashboard
      steps:
        - click:
            shot: DevOps Test Hub - Initial - Team Space Dashboard_6oufhg.dti.jpeg#21
            object: html.img
            identifiers:
              - properties:
                  - src: content/images/banner-brand-icon-3.svg
        - click:
            shot: DevOps Test Hub - Initial - Team Space Dashboard_ojp3lb.dti.jpeg#311
            object: html.div
            identifiers:
              - properties:
                  - content: No description.
  - run:
      enabled: 'false'
      url: SetDevBranch.dtx.yaml
  - with:
      note: DevOps Test Hub - 1550 - Overview
      steps:
        - click:
            shot: DevOps Test Hub - 1550 - Overview_3x57qj.dti.jpeg#410
            object: html.div
            identifiers:
              - properties:
                  - content: Manage
  - with:
      note: DevOps Test Hub - TestProject - Configuration
      steps:
        - click:
            shot: DevOps Test Hub - TestProject - Configuration_5ek2yv.dti.jpeg#753
            object: html.span
            identifiers:
              - properties:
                  - content: Add Repository
        - click:
            shot: DevOps Test Hub - TestProject - Configuration_mc6bwo.dti.jpeg#1128
            object: html.span
            identifiers:
              - properties:
                  - content: Remote Repository
        - click:
            shot: DevOps Test Hub - TestProject - Configuration_mc6bwo.dti-1784800687531.dti.jpeg
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Git URL
        - type:
            shot: DevOps Test Hub - TestProject - Configuration_2mlwxf.dti.jpeg#1432
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Git URL
            value: '${Git_URL}'
        - click:
            shot: DevOps Test Hub - TestProject - Configuration_mi6yrz.dti.jpeg#2043
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
        - type:
            shot: DevOps Test Hub - TestProject - Configuration_cxmu37.dti.jpeg#2345
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
            value: '${Username_2}'
        - click:
            shot: DevOps Test Hub - TestProject - Configuration_zurpzk.dti.jpeg#2967
            object: html.button
            identifiers:
              - properties:
                  - content: Add
        - wait: 10000ms
        - click:
            shot: DevOps Test Hub - TestProject - Configuration_55qrgd.dti.jpeg#3063
            object: html.div
            identifiers:
              - properties:
                  - content: Execute
                locators:
                  - below:
                      object: html.div
                      properties:
                        - content: TestProject
  - with:
      note: DevOps Test Hub - TestProject - Execution
      steps:
        - click:
            shot: DevOps Test Hub - TestProject - Execution_5ng2sq.dti.jpeg#3417
            object: html.span
            identifiers:
              - properties:
                  - content: SUITES
        - click:
            shot: DevOps Test Hub - TestProject - Execution_s6aqlk.dti.jpeg#4050
            object: html.button
            identifiers:
              - properties:
                  - aria-label: 'Open execution dialog for: Personalized Shopping
                      Experience'
                locators:
                  - inside:
                      object: html.td
                      properties:
                        - position: '7 : 6'
        - click:
            shot: DevOps Test Hub - TestProject - Execution_52ckhp.dti.jpeg#4636
            object: html.span
            identifiers:
              - properties:
                  - content: Advanced
        - click:
            shot: DevOps Test Hub - TestProject - Execution_63rnhz.dti.jpeg#5086
            object: html.textarea
            identifiers:
              - properties:
                  - label: Program Arguments
        - type:
            shot: DevOps Test Hub - TestProject - Execution_2zemp2.dti.jpeg#5563
            object: html.textarea
            identifiers:
              - properties:
                  - label: Program Arguments
            value: '${Program_Arguments}'
        - click:
            shot: DevOps Test Hub - TestProject - Execution_mvbxjh.dti.jpeg#6554
            object: html.span
            identifiers:
              - properties:
                  - content: Execute
        - do:
            steps:
              - wait: 3000ms
              - assign:
                  shot: DevOps Test Hub - TestProject - Execution_vtnzzz.dti.jpeg#6901
                  object: html.td
                  identifiers:
                    - properties:
                        - xpath: //div[@id='main']/div[2]/div[2]/div/table/tbody/tr[6]/td[5]
                  properties:
                    - content:
                        - var: Done
            while: Done != 'Fail' && Done != 'Error' && Done != 'Pass'
  - verify: Done == 'Pass'
  - with:
      note: DevOps Test Hub - TestProject - Results
      steps:
        - click:
            shot: DevOps Test Hub - TestProject - Results_qex76f.dti.jpeg#6998
            object: html.img
            identifiers:
              - properties:
                  - src: content/images/banner-brand-icon-3.svg
