note: Generated from recorded traffic using edge 145.0.3800.82
configuration:
  dataset: Valuess.csv
  stepTimeout: 45s
  profile: edge
  vars:
    APP_SofyTestDemo_URL:
      expr: gTestHubUrl
      type: column
    Username: demo.user
    Password:
      expr: gTestHubPassword
      type: column
    Name: hostname
    Value:
      expr: gCommerceHostname
      type: column
    Name_2: port_num
    Value_3: '443'
    Done: UnInitialized
steps:
  - open:
      enabled: 'false'
      note: Open SofyTestDemo
      url: '${APP_SofyTestDemo_URL}'
  - with:
      enabled: 'false'
      note: Sign in to platform
      steps:
        - click:
            shot: Sign in to platform_xp2upe.dti.jpeg#48
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
        - type:
            shot: Sign in to platform_zpr2cy.dti.jpeg#86
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Username
            value: '${Username}'
        - click:
            shot: Sign in to platform_fmuzzh.dti.jpeg#165
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
        - type:
            shot: Sign in to platform_j6jiuh.dti.jpeg#203
            object: html.inputpassword
            identifiers:
              - properties:
                  - label: Password
            value: '${Password}'
        - wait: 3000ms
        - click:
            shot: Sign in to platform_n6vgtz.dti.jpeg#286
            object: html.button
            identifiers:
              - properties:
                  - content: Sign In
        - wait: 3000ms
  - with:
      note: DevOps Test Hub - Initial - Team Space Dashboard
      steps:
        - click:
            shot: DevOps Test Hub - Initial - Team Space Dashboard_pe33lj.dti.jpeg#43
            object: html.img
            identifiers:
              - properties:
                  - src: content/images/banner-brand-icon-3.svg
        - click:
            shot: DevOps Test Hub - Initial - Team Space Dashboard_43iqlm.dti.jpeg#322
            object: html.span
            identifiers:
              - properties:
                  - content: TestProject
  - run:
      enabled: 'false'
      url: SetDevBranch.dtx.yaml
  - with:
      note: DevOps Test Hub - 1150 - Overview
      steps:
        - click:
            shot: DevOps Test Hub - 1150 - Overview_ajdpnt.dti.jpeg#457
            object: html.div
            identifiers:
              - properties:
                  - content: Execute
  - with:
      note: DevOps Test Hub - TestProject - Execution
      steps:
        - click:
            shot: DevOps Test Hub - TestProject - Execution_lxs5fl.dti.jpeg#929
            object: html.button
            identifiers:
              - properties:
                  - aria-label: 'Open execution dialog for: Register Users and Add
                      Address'
                locators:
                  - inside:
                      object: html.td
                      properties:
                        - position: '7 : 5'
        - click:
            shot: DevOps Test Hub - TestProject - Execution_sems24.dti.jpeg#1392
            object: html.span
            identifiers:
              - properties:
                  - content: VARIABLES
        - click:
            shot: DevOps Test Hub - TestProject - Execution_3x2ob5.dti.jpeg#1880
            object: html.span
            identifiers:
              - properties:
                  - content: Add Variable
        - type:
            shot: DevOps Test Hub - TestProject - Execution_7ub56u.dti.jpeg#2400
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Name
            value: '${Name}'
        - click:
            shot: DevOps Test Hub - TestProject - Execution_pghvht.dti.jpeg#3387
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Value
        - click:
            shot: DevOps Test Hub - TestProject - Execution_sv4e6h.dti.jpeg#3879
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Value
        - type:
            shot: DevOps Test Hub - TestProject - Execution_of2gw5.dti.jpeg#4371
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Value
            value: '${Value}'
        - click:
            shot: DevOps Test Hub - TestProject - Execution_xll72y.dti.jpeg#5362
            object: html.button
            identifiers:
              - properties:
                  - content: Add
        - click:
            shot: DevOps Test Hub - TestProject - Execution_gnchj4.dti.jpeg#5793
            object: html.span
            identifiers:
              - properties:
                  - content: Add Variable
        - click:
            shot: DevOps Test Hub - TestProject - Execution_lqgbf3.dti.jpeg#6345
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Name
        - type:
            shot: DevOps Test Hub - TestProject - Execution_gkrm6z.dti.jpeg#6853
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Name
            value: '${Name_2}'
        - click:
            shot: DevOps Test Hub - TestProject - Execution_cgpnsf.dti.jpeg#7872
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Value
        - type:
            shot: DevOps Test Hub - TestProject - Execution_wsc537.dti.jpeg#8380
            object: html.inputtext
            identifiers:
              - properties:
                  - label: Value
            value: '${Value_3}'
        - click:
            shot: DevOps Test Hub - TestProject - Execution_r5544r.dti.jpeg#9402
            object: html.span
            identifiers:
              - properties:
                  - content: Add
        - click:
            shot: DevOps Test Hub - TestProject - Execution_yd2cxg.dti.jpeg#9897
            object: html.span
            identifiers:
              - properties:
                  - content: Execute
        - do:
            steps:
              - wait: 10000ms
              - assign:
                  shot: DevOps Test Hub - TestProject - Execution_lwqv55.dti.jpeg#10005
                  object: html.td
                  identifiers:
                    - properties:
                        - position: '5 : 5'
                  properties:
                    - content:
                        - var: Done
            while: Done != 'Pass' && Done != 'Error'
        - click:
            shot: DevOps Test Hub - TestProject - Execution_lwqv55.dti.jpeg#10005
            object: html.div
            identifiers:
              - properties:
                  - content: Analyze
                locators:
                  - position: '3'
  - with:
      note: DevOps Test Hub - TestProject - Results
      steps:
        - click:
            shot: DevOps Test Hub - TestProject - Results_e3nvmd.dti.jpeg#10515
            object: html.a
            identifiers:
              - properties:
                  - content: Register Users and Add Address
        - click:
            shot: DevOps Test Hub - TestProject - Results_evdbio.dti.jpeg#10921
            object: html.button
            identifiers:
              - properties:
                  - aria-label: Close
        - click:
            shot: DevOps Test Hub - TestProject - Results_fqyrgp.dti.jpeg#11079
            object: html.img
            identifiers:
              - properties:
                  - src: content/images/banner-brand-icon-3.svg
