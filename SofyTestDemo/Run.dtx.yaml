configuration:
  dataset: Valuess.csv
  stepTimeout: 46s
  profile: edge
  vars:
    gPrometheusIp: ''
    gPrometheusPort: ''
    gCommerceHostname:
      expr: gCommerceHostname
      type: column
    gCommercePort:
      expr: gCommercePort
      type: column
    gTestHubUrl:
      expr: gTestHubUrl
      type: column
    gConsoleUrl:
      expr: gConsoleUrl
      type: column
    gConsolePassword:
      expr: gConsolePassword
      type: column
    gTestHubPassword:
      expr: gTestHubPassword
      type: column
    githubUser:
      expr: githubUser
      type: column
steps:
  - run:
      url: asset://github.com%2Fjayglafe%2FSofyDemoTesting/SofyConsole/SofyConsoleHealthCheck.dtx.yaml
      in:
        Password: '${gConsolePassword}'
        APP_SofyConsole_URL: '${gConsoleUrl}'
      out:
        PrometheusIp: gPrometheusIp
        PrometheusPort: gPrometheusPort
  - run:
      url: Login.dtx.yaml
      in:
        Password: '${gTestHubPassword}'
        APP_SofyTestDemo_URL: '${gTestHubUrl}'
  - run:
      url: DeleteProject.dtx.yaml
      in:
        APP_SofyTestDemo_URL: '${gTestHubUrl}'
        Password: '${gTestHubPassword}'
  - run:
      url: NewProject.dtx.yaml
      in:
        Password: '${gTestHubPassword}'
        Username_2: '${githubUser}'
        APP_SofyConsole_URL: '${gTestHubUrl}'
  - run:
      url: SetDevBranch.dtx.yaml
      in:
        Password: '${gTestHubPassword}'
        APP_SofyTestDemo_URL: '${gTestHubUrl}'
        pp: '${gTestHubPassword}'
  - run:
      url: RunFirstTest.dtx.yaml
      in:
        Password: '${gTestHubPassword}'
        Value: '${gCommerceHostname}'
        Value_3: '${gCommercePort}'
        APP_SofyTestDemo_URL: '${gTestHubUrl}'
  - run:
      url: RunAPITests.dtx.yaml
      in:
        Password: '${gTestHubPassword}'
        APP_SofyTestDemo_URL: https://${gTestHubUrl}/test/
  - run:
      url: RunPostmanTest.dtx.yaml
      in:
        APP_SofyTestDemo_URL: https://${gTestHubUrl}/test/
        Password: '${gTestHubPassword}'
        Username_2: '${githubUser}'
  - run:
      url: RunJMeter.dtx.yaml
      in:
        Password: '${gTestHubPassword}'
        APP_SofyTestDemo_URL: '${gTestHubUrl}'
  - run:
      url: RunPerformanceTest.dtx.yaml
      in:
        PrometheusIp: '${gPrometheusIp}'
        PrometheusPort: '${gPrometheusPort}'
        Password: '${gTestHubPassword}'
        Target_host: '${gPrometheusIp}'
        APP_SofyTestDemo_URL: '${gTestHubUrl}'
  - run:
      url: RunSecondTest.dtx.yaml
      in:
        Password: '${gTestHubPassword}'
        Value: '${gCommerceHostname}'
        Value_3: '${gCommercePort}'
        APP_SofyTestDemo_URL: '${gTestHubUrl}'
  - run:
      url: RunWithNewData.dtx.yaml
      in:
        Password: '${gTestHubPassword}'
        APP_SofyTestDemo_URL: '${gTestHubUrl}'
        pp: '${gTestHubPassword}'
  - run:
      url: RunWithDDF.dtx.yaml
      in:
        Password: '${gTestHubPassword}'
        APP_SofyTestDemo_URL: '${gTestHubUrl}'
        ddd: '${gTestHubPassword}'
